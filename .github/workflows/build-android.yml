name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0). Leave empty to use git tag or generate one.'
        required: false
        type: string

permissions:
  contents: write

env:
  APP_DIR: artifacts/pantry-keeper
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Java and Android SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk-headless unzip wget
          java -version
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "Android SDK installed at $ANDROID_HOME"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v10
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate native Android project
        working-directory: ${{ env.APP_DIR }}
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Setup signing
        env:
          KB64: ${{ secrets.KEYSTORE_BASE64 }}
          KSPW: ${{ secrets.KEYSTORE_PASSWORD }}
          KALIAS: ${{ secrets.KEY_ALIAS }}
          KPW: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KB64" ]; then
            echo "No signing key - skipping (debug build)"
            exit 0
          fi
          echo "$KB64" | base64 -d > "${{ env.APP_DIR }}/android/app/release.keystore"
          printf 'RELEASE_STORE_FILE=release.keystore\nRELEASE_STORE_PASSWORD=%s\nRELEASE_KEY_ALIAS=%s\nRELEASE_KEY_PASSWORD=%s\n' \\
            "$KSPW" "$KALIAS" "$KPW" \\
            > "${{ env.APP_DIR }}/android/signing.properties"
          python3 .github/scripts/patch-signing.py "${{ env.APP_DIR }}/android"

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          if [ -f "signing.properties" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate APK
        id: apk
        run: |
          APK=$(find "${{ env.APP_DIR }}/android/app/build/outputs/apk" -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(date +%Y%m%d.%H%M%S)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pantry-keeper-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Pantry Keeper ${{ steps.tag.outputs.tag }}
          body: |
            ## Pantry Keeper ${{ steps.tag.outputs.tag }}

            ### Install
            Download the APK below and install on your Android device.
            Or add this repo to [Obtainium](https://github.com/ImranR98/Obtainium) for automatic updates.

            **Obtainium URL:** `https://github.com/${{ github.repository }}`
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
          generate_release_notes: true
