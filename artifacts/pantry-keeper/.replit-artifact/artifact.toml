kind = "mobile"
previewPath = "/"
title = "Pantry Keeper"
description = "An Android pantry tracker for long-term food supplies. Users can scan products with the camera, capture expiration dates, organize items by named shelves, and receive configurable reminders before food expires."
version = "1.0.0"
id = "artifacts/pantry-keeper"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 26125

[services.development]
run = "pnpm --filter @workspace/pantry-keeper run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pantry-keeper", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pantry-keeper", "run", "serve" ]

[services.env]
PORT = "26125"
BASE_PATH = "/"
