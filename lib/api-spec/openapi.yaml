openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: Pantry label recognition operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/analyze-label:
    post:
      operationId: analyzePantryLabel
      tags: [ai]
      summary: Read a pantry label photo with OpenRouter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzePantryLabelBody"
      responses:
        "200":
          description: Extracted label fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzePantryLabelResponse"
        "400":
          description: Invalid image request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI provider failed to read the label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnalyzePantryLabelBody:
      type: object
      properties:
        model:
          type: string
          default: google/gemini-3.8-flash
        kind:
          type: string
          enum: [product, expiry]
        imageData:
          type: string
          description: Data URL containing a compressed label photo
      required:
        - kind
        - imageData
    AnalyzePantryLabelResponse:
      type: object
      properties:
        name:
          type: string
        expiryDate:
          type: string
        confidence:
          type: number
      required: []
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

